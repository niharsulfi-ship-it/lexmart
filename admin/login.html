<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Lexmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-style.css">
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: var(--bg-light);
    }
    .login-card {
      background: var(--surface);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      text-align: center;
    }
    .login-card h2 {
      font-family: 'Poppins', sans-serif;
      color: var(--primary);
      font-size: 28px;
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary);
    }
    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 14px;
      font-size: 15px;
      margin-top: 10px;
    }
    .error-msg {
      color: var(--danger);
      background-color: #fee2e2;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 15px;
    }
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrap input {
      padding-right: 40px; /* space for icon */
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password:hover {
      color: var(--text-dark);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <h2>Lexmart Admin</h2>
      <p>Sign in to access your dashboard</p>
      
      <div id="error-message" class="error-msg">Invalid credentials. Please try again.</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <span class="toggle-password" id="togglePassword">
              <!-- Eye icon -->
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login">Login to Dashboard</button>
        
        <div class="hint">Hint: lexmartAdmin@gmail.com / Lexmartadmin@123</div>
      </form>
    </div>
  </div>

  <script>
    // Password visibility toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        passInput.type = 'password';
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    });

    // Authentication via Remote API
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.querySelector('.btn-login');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = 'Logging in...';
      submitBtn.disabled = true;
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      
      try {
        const response = await fetch('https://lexmart.brandmindz.in/api/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.status === 'success') {
          localStorage.setItem('admin_logged_in', 'true');
          localStorage.setItem('admin_token', data.token); // Store token if provided
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.message || 'Invalid credentials. Please try again.';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = 'Could not connect to the API server.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // Check if already logged in
    if (localStorage.getItem('admin_logged_in') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
