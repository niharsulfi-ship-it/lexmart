<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Enquiries | Lexmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-style.css">
  
  <script>
    // Authentication Check
    if (localStorage.getItem('admin_logged_in') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </symbol>
      <symbol id="i-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </symbol>
      <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </symbol>
    </defs>
  </svg>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Lexmart Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="index.html" class="active">
            <svg><use href="#i-mail" /></svg>
            Enquiries
          </a>
        </li>
        <li>
          <a href="blogs.html">
            <svg><use href="#i-file-text" /></svg>
            Blogs
          </a>
        </li>
      </ul>
    </nav>
    <div style="padding: 24px; border-top: 1px solid var(--border);">
      <a href="#" onclick="logout()" style="color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 500;">
        <svg style="width:18px;height:18px;"><use href="#i-log-out" /></svg>
        Logout
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="topbar">
      <h1>Enquiries Module</h1>
      <div class="topbar-user">
        <span>Admin User</span>
        <div class="avatar">A</div>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="card">
        <div class="card-header">
          <h3>Recent Enquiries</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email / Phone</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="enquiryTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px;">
                Loading data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="modal-overlay" id="enquiryModal" aria-hidden="true">
      <section class="modal enquiry-modal" role="dialog" aria-modal="true" aria-labelledby="enquiryModalTitle">
        <div class="enquiry-modal-header">
          <h3 id="enquiryModalTitle">Enquiry details</h3>
          <button type="button" class="modal-close" id="closeEnquiryModal" aria-label="Close enquiry details">&times;</button>
        </div>
        <dl class="enquiry-details">
          <div><dt>Name</dt><dd id="modalEnquiryName"></dd></div>
          <div><dt>Email</dt><dd id="modalEnquiryEmail"></dd></div>
          <div><dt>Phone</dt><dd id="modalEnquiryPhone"></dd></div>
          <div><dt>Subject</dt><dd id="modalEnquirySubject"></dd></div>
          <div class="enquiry-message"><dt>Message</dt><dd id="modalEnquiryMessage"></dd></div>
        </dl>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="enquiryModalDone">Done</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    function logout() {
      localStorage.removeItem('admin_logged_in');
      window.location.href = 'login.html';
    }

    const enquiriesEndpoint = 'https://lexmart.brandmindz.in/api/enquiry.php';

    function closeEnquiryModal() {
      const modal = document.getElementById('enquiryModal');
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
    }

    function showEnquiryModal(enquiry) {
      document.getElementById('modalEnquiryName').textContent = enquiry.name || 'N/A';
      document.getElementById('modalEnquiryEmail').textContent = enquiry.email || 'N/A';
      document.getElementById('modalEnquiryPhone').textContent = enquiry.phone || 'Not provided';
      document.getElementById('modalEnquirySubject').textContent = enquiry.service || enquiry.subject || 'Not specified';
      document.getElementById('modalEnquiryMessage').textContent = enquiry.message || 'No message provided.';

      const modal = document.getElementById('enquiryModal');
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function markEnquiryAsViewed(enquiry) {
      if (Number(enquiry.is_read) === 1) return;

      const response = await fetch(`${enquiriesEndpoint}?action=mark-read`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ id: enquiry.id })
      });
      const result = await response.json();
      if (!response.ok || result.status !== 'success') {
        throw new Error(result.message || 'Unable to mark enquiry as viewed.');
      }
    }

    // Fetch dynamic data from the API.
    async function loadEnquiries() {
      const tableBody = document.getElementById('enquiryTableBody');
      try {
        const response = await fetch(enquiriesEndpoint);
        
        // Handle if user is on Live Server and PHP didn't execute
        if (!response.ok) throw new Error('API request failed');
        const textData = await response.text();
        
        // Quick check if raw PHP is returned (Live Server issue)
        if (textData.trim().startsWith('<?php')) {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 20px;">Cannot load dynamic data. Please run on a PHP-enabled server.</td></tr>`;
          return;
        }

        const data = JSON.parse(textData);
        
        if (data.status === 'success' && data.data && data.data.length > 0) {
          tableBody.innerHTML = '';
          data.data.forEach(enq => {
            const tr = document.createElement('tr');
            const dateStr = enq.created_at ? new Date(enq.created_at).toLocaleDateString() : 'N/A';
            const isViewed = Number(enq.is_read) === 1;
            const status = isViewed ? 'Viewed' : 'New';
            const statusClass = isViewed ? 'badge-success' : 'badge-warning';

            const createCell = function (value) {
              const cell = document.createElement('td');
              cell.textContent = value;
              return cell;
            };
            const contactCell = document.createElement('td');
            contactCell.append(document.createTextNode(enq.email || 'N/A'));
            if (enq.phone) {
              const phone = document.createElement('small');
              phone.textContent = enq.phone;
              contactCell.append(document.createElement('br'), phone);
            }
            const statusCell = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = `badge ${statusClass}`;
            badge.textContent = status;
            statusCell.appendChild(badge);
            const actionsCell = document.createElement('td');
            const viewButton = document.createElement('button');
            viewButton.type = 'button';
            viewButton.className = 'btn-outline';
            viewButton.textContent = 'View';
            viewButton.addEventListener('click', async function () {
              showEnquiryModal(enq);
              try {
                await markEnquiryAsViewed(enq);
                loadEnquiries();
              } catch (error) {
                console.error('Unable to mark enquiry as viewed:', error);
              }
            });
            actionsCell.appendChild(viewButton);

            tr.append(
              createCell(dateStr),
              createCell(enq.name || 'N/A'),
              contactCell,
              createCell(enq.service || enq.subject || 'No Subject'),
              statusCell,
              actionsCell
            );
            tableBody.appendChild(tr);
          });
        } else {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">No enquiries found.</td></tr>`;
        }
      } catch (error) {
        console.error('Error fetching enquiries:', error);
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 20px;">Failed to load data. Ensure API is running.</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadEnquiries();
      document.getElementById('closeEnquiryModal').addEventListener('click', closeEnquiryModal);
      document.getElementById('enquiryModalDone').addEventListener('click', closeEnquiryModal);
      document.getElementById('enquiryModal').addEventListener('click', function (event) {
        if (event.target === this) closeEnquiryModal();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeEnquiryModal();
      });
    });
  </script>
</body>
</html>
